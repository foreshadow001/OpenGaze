# GazeCapture 数据集配置（预处理产物：zhang2015-insightface 管线，BGR 存储）
# 训练/测试协议参考 FAZE（ICCV19）的被试级筛选（无 few-shot、用全帧；2026-08-26 定稿）：
#   train: 官方 train 1321 session 中样本数 ≥500 → 1069 session，1,942,187 帧（低于 500 不参与训练）
#   test : 官方 test 150 session 中样本数 ≥1000 → 123 session，259,776 帧（低于 1000 不参与测试；
#          FAZE 只取每人最后 500 帧做评测；本平台无校准环节，直接用该被试全部帧）
# 筛选后的 session 列表在 configs/splits/gazecapture_faze.yaml（按预处理产物帧数生成，
# 见其头注释）；官方全量划分 gazecapture_sessions.yaml 仅供预处理使用。
name: gazecapture
data_dir: /media/yanglinxuan/ylx/gazecapture_insightface_224

split:
  train:
    sub_folder: train
    split_file: configs/splits/gazecapture_faze.yaml   # FAZE 式筛选后的 session 列表
    split_key: train
  test:
    sub_folder: test
    split_file: configs/splits/gazecapture_faze.yaml
    split_key: test

dataloader:
  num_workers: 5
  train_sample_size: 0              # 0 = 全量训练
  test_sample_size: 0
