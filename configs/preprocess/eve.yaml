# EVE 预处理配置（原始 mp4+h5 → 统一 h5，管线 preprocess/zhang2015-insightface/eve/）
#
# 原始数据格式（/media/hitsz/ylx/EVE_dataset/eve_dataset/<被试>/<step 刺激目录>/）：
#   {cam}.mp4             原始帧 1920x1080（官方已去畸变），cam ∈ basler/webcam_l/webcam_c/webcam_r
#   {cam}.h5              标签与标定：face_PoG_tobii（屏幕像素，视线标签源头）、
#                         camera_matrix / camera_transformation / millimeters_per_pixel
#   {cam}.timestamps.txt  帧时间戳（与 mp4 帧、h5 行一一对应）
# 官方 test01-06 无 Tobii 标注（且仅 6/10 人）不可用；官方 val05 被试转为平台 test。
# 帧有效性由 face_PoG_tobii/validity + 本管线成败决定（检不到脸 = no_face_detected）。
# 详细勘探与公式验证见 preprocess/zhang2015-insightface/eve/dataset_report.md。
name: eve
raw_data_dir: /media/hitsz/ylx/EVE_dataset/eve_dataset
output_dir: /home/hitsz/dataset/eve_insightface_224
cameras: [basler, webcam_l, webcam_c, webcam_r]   # 四相机全用，同一时刻四视角
target_hz: 5            # 采样率：interval = round(fps/target_hz)，basler 每 12 帧、webcam 每 6 帧
splits:                 # 平台划分：官方 train39 训练，官方 val05 → test（D3）
  train: [train01, train02, train03, train04, train05, train06, train07, train08,
          train09, train10, train11, train12, train13, train14, train15, train16,
          train17, train18, train19, train20, train21, train22, train23, train24,
          train25, train26, train27, train28, train29, train30, train31, train32,
          train33, train34, train35, train36, train37, train38, train39]
  test: [val01, val02, val03, val04, val05]
subjects: []            # 调试：只处理这些被试，空列表 = splits 全部
max_steps: 0            # 调试：每被试只处理前 N 个 step（0 = 全部）
max_frames: 0           # 调试：每 step 只处理流内前 N 帧（0 = 全部）
num_read_workers: 1     # mp4 预读线程（顺序解码 0.7ms/帧 << 检测 11.6ms，单线程足够）
providers: [CUDAExecutionProvider, CPUExecutionProvider]  # insightface 推理后端
