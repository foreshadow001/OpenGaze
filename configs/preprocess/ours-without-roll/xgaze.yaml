# ours-without-roll 版 XGaze 归一化配置（v3，协议见 preprocess/ours-without-roll/normalization_protocol.md）
# 数据源 = v2 产物（几何恢复）+ 原始数据（读图）；输出 roll-only 归一化
name: xgaze
v2_dir: /media/yanglinxuan/sfm/xgaze_specific_224      # v2 产物（索引 + 几何真源）
raw_data_dir: /media/yanglinxuan/Expansion/xgaze_raw/data   # 原始数据（读图）
sub_folder: train
calib_dir: /media/yanglinxuan/Expansion/xgaze_raw/calibration/cam_calibration  # 内参/外参 xml
output_dir: /media/yanglinxuan/sfm/xgaze_noroll_224    # 输出（每人一个 h5，lzf）
subjects: []           # 空列表 = 全部；指定则如 [0, 3]（subject0000 语法）
max_frames: 0          # 调试：每人前 N 帧（0 = 全部）
num_read_workers: 18   # 读图线程数（18 相机并发）
