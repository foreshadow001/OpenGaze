# GazeCapture 预处理配置（原始 json+frames → 统一 h5，管线 preprocess/zhang2015-insightface/gazecapture/）
#
# 原始数据格式（每 session 目录，五位数编号 = 一个被试的一段设备采集）：
#   frames/%05d.jpg        原始前置摄像头帧（唯一使用的图像来源）
#   frames.json            帧号列表
#   dotInfo.json           注视点：XCam/YCam（相机系坐标，视线标签来源）+ XPts/YPts（屏幕像素）
#   info.json              TotalFrames / DeviceName / Dataset
#   screen.json            H / W / Orientation
# 官方的 appleFace/appleLeftEye/appleRightEye/faceGrid 检测结果与 IsValid 标记
# 一律不使用：人脸定位完全由我们的管线（insightface 106 点）完成，
# 帧的有效性由我们管线自身的成败决定（检不到脸 = no_face_detected 记录失败）。
# 本平台不使用验证集：官方 val 已并入 train（见 split_file 注释）。
name: gazecapture
raw_data_dir: /media/hitsz/ylx/GazeCapture
output_dir: /media/hitsz/ylx/gazecapture_insightface_224
split_file: configs/splits/gazecapture_sessions.yaml   # session 级 train/test 划分（val 已并入 train）
calibration_dir: /media/hitsz/ylx/GazeCapture/calibration  # 内参 xml（generate_calibration.py 生成，15 设备×双分辨率）
sessions: []          # 空列表 = split_file 中全部 session；指定则如 ['00002', '00103']
splits: [train, test] # 处理哪些 split（输出按 split 分目录）
max_frames: 0         # 调试用：每 session 只处理前 N 帧（0 = 全部）
num_read_workers: 8   # 读图线程数
providers: [CUDAExecutionProvider, CPUExecutionProvider]  # insightface 推理后端
